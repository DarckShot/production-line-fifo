name: Angular CI and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: &runner ubuntu-latest
    timeout-minutes: &timeout 15
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7

      - &setup-node
        name: Set up Node.js and cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      - &install
        name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    needs: format
    runs-on: *runner
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *setup-node
      - *install

      - name: Lint TypeScript and Angular templates
        run: npm run lint

  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: *runner
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *setup-node
      - *install

      - name: Run unit tests
        run: npm test -- --watch=false

  build:
    name: Production build
    needs: unit-tests
    runs-on: *runner
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *setup-node
      - *install

      - name: Build Angular for production
        run: npm run build -- --base-href /production-line-fifo/

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/production-line-fifo/browser

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: *runner
    timeout-minutes: *timeout
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
