<div class="status-control">
  <label [attr.for]="pickerId + '-trigger'">Изменить статус</label>
  <button
    #statusTrigger
    [id]="pickerId + '-trigger'"
    type="button"
    class="status-trigger"
    [class.pointer-focus]="pointerFocus()"
    [attr.aria-label]="'Изменить статус продукта ' + productId() + '. Сейчас: ' + status()"
    aria-haspopup="listbox"
    [attr.aria-controls]="pickerId + '-menu'"
    [attr.aria-expanded]="menuOpen()"
    (pointerdown)="pointerFocus.set(true)"
    (keydown)="onTriggerKeydown($event)"
    (blur)="pointerFocus.set(false)"
    (click)="toggleMenu()"
  >
    <span>{{ status() }}</span>
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none">
      <path
        d="m4 6.5 4 4 4-4"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <ul
    #statusMenu
    [id]="pickerId + '-menu'"
    [appAnchoredPopover]="statusTrigger"
    class="status-menu"
    popover="manual"
    role="listbox"
    [attr.aria-label]="'Статус продукта ' + productId()"
    (dismissed)="closeMenu($event === 'escape')"
    (keydown)="onMenuKeydown($event)"
  >
    @for (option of statuses; track option) {
      <li
        role="option"
        tabindex="-1"
        [attr.aria-selected]="option === status()"
        (click)="chooseStatus(option)"
      >
        {{ option }}
      </li>
    }
  </ul>
</div>
